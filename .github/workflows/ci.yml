name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mutation:
    name: Focused mutation (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - orchestration
          - package-preservation
          - patch-error
          - relationships
          - shape-range
          - text-xml
          - transform-xml
          - roundtrip-consistency
          - roundtrip-edit
          - roundtrip-preview
          - group-preview
          - image-crop-xml
          - table-preview
          - table-preview-cell
          - scene-table-validation
          - scene-table-cell-validation
          - scene-table-merge-validation
          - roundtrip-validation
          - writer-chart
          - writer-shape
          - writer-group
          - writer-group-verify
          - writer-image
          - writer-table
          - writer-table-verify
          - font-style
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: reports/mutation/cache/${{ matrix.module }}-dynamic.json
          key: mutation-${{ runner.os }}-${{ matrix.module }}-${{ github.sha }}
          restore-keys: mutation-${{ runner.os }}-${{ matrix.module }}-
      - run: pnpm test:mutation:module -- ${{ matrix.module }} --dynamic

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser:
    name: Chromium, Firefox, and WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure reliable Ubuntu package mirrors
        run: |
          for sources in \
            /etc/apt/apt-mirrors.txt \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources
          do
            if [ -f "$sources" ]; then
              sudo sed -i \
                's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$sources"
            fi
          done
          sudo tee /etc/apt/apt.conf.d/99-oakit-network >/dev/null <<'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Languages "none";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
